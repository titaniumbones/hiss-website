# Netlify configuration for HISS Hub website
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build command
  command = "npm run build"

  # Node version
  environment = { NODE_VERSION = "20" }

# Next.js specific plugin for Netlify
# This plugin handles all Next.js routing and deployment
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific build settings

# Production deployment
[context.production]
  command = "npm run build"

  [context.production.environment]
    NEXT_PUBLIC_SITE_URL = "https://hiss.utsc.utoronto.ca"
    NODE_ENV = "production"

# Deploy previews (PR previews)
[context.deploy-preview]
  command = "npm run build"

  [context.deploy-preview.environment]
    NODE_ENV = "production"

# Branch deploys
[context.branch-deploy]
  command = "npm run build"

# Development context
[context.dev]
  command = "npm run dev"
